enum AppRewardTransferKind {
  DEPOSIT
  WITHDRAW
  DISTRIBUTION
}

type AllocationVoteCastEvent @entity(immutable: true) {
  id: Bytes!
  voter: Bytes!
  round: String!
  roundId: BigInt!
  apps: String!
  voteWeights: String!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  emitter: Bytes!
}

type AppRewardTransfer @entity(immutable: true) {
  id: Bytes!
  app: Bytes!
  round: String!
  amountExact: BigInt!
  kind: AppRewardTransferKind!
  from: Bytes
  to: Bytes
  reason: String
  proof: String
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  emitter: Bytes!
}

type SustainabilityProofDocument @entity(immutable: true) {
  id: ID!
  transfer: Bytes!
  app: Bytes!
  round: String!
  account: Bytes!
  rewardExact: BigInt!
  proofType: String
  proofData: String
  description: String
  additionalInfo: String
  carbon: BigInt!
  water: BigInt!
  energy: BigInt!
  wasteMass: BigInt!
  plastic: BigInt!
  timber: BigInt!
  educationTime: BigInt!
  treesPlanted: BigInt!
  caloriesBurned: BigInt!
  sleepQualityPercentage: BigInt!
  cleanEnergyProduction: BigInt!
  wasteItems: BigInt!
  people: BigInt!
  biodiversity: BigInt!
  version: Int!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  emitter: Bytes!
  rawJson: String!
}

