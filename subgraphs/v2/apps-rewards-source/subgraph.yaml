specVersion: 1.3.0
features:
  - nonDeterministicIpfs
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: rewarder
    network: mainnet
    source:
      address: "0x838A33AF756a6366f93e201423E1425f67eC0Fa7"
      abi: Rewarder
      startBlock: 18868867
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RoundRewardClaimed
        - RoundRewardVoteRegistered
        - RoundGMVoteRegistered
      abis:
        - name: Rewarder
          file: ../../../abis/VeBetterDAO-voter-rewards.json
      eventHandlers:
        - event: RewardClaimed(indexed uint256,indexed address,uint256)
          handler: handleRewardClaimed
        - event: RewardClaimedV2(indexed uint256,indexed address,uint256,uint256)
          handler: handleRewardClaimedV2
        - event: VoteRegistered(indexed uint256,indexed address,uint256,uint256)
          handler: handleRewardVoteRegistered
        - event: GMVoteRegistered(indexed uint256,indexed uint256,indexed uint256,uint256)
          handler: handleGMVoteRegistered
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: xallocationvoting
    network: mainnet
    source:
      address: "0x89A00Bb0947a30FF95BEeF77a66AEdE3842Fe5B7"
      abi: XAllocationVoting
      startBlock: 18868869
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RoundCreatedEvent
        - AllocationVoteCastEvent
      abis:
        - name: XAllocationVoting
          file: ../../../abis/VeBetterDAO-allocations-voting.json
      eventHandlers:
        - event: AllocationVoteCast(indexed address,indexed uint256,bytes32[],uint256[])
          handler: handleAllocationVoteCast
        - event: RoundCreated(uint256,address,uint256,uint256,bytes32[])
          handler: handleRoundCreated
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: xallocationpool
    network: mainnet
    source:
      address: "0x4191776f05f4be4848d3f4d587345078b439c7d3"
      abi: XAllocationPool
      startBlock: 18868869
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppAllocationFunded
      abis:
        - name: XAllocationPool
          file: ../../../abis/VeBetterDAO-x-allocation-pool.json
      eventHandlers:
        - event: AllocationRewardsClaimed(indexed bytes32,uint256,uint256,indexed address,address,uint256,uint256,uint256)
          handler: handleAllocationRewardsClaimed
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: x2earnapps
    network: mainnet
    source:
      address: "0x8392B7CCc763dB03b47afcD8E8f5e24F9cf0554D"
      abi: XApps
      startBlock: 18868857
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppRegistered
        - AppMetadataChanged
        - AppMetadataDocument
        - AppVotingEligibilityChanged
        - AppBlacklistChanged
        - AppEndorsementChanged
        - AppEndorsementStatusChanged
      abis:
        - name: XApps
          file: ../../../abis/VeBetterDAO-x-2-earns-apps.json
      eventHandlers:
        - event: AppAdded(indexed bytes32,address,string,bool)
          handler: handleAppAdded
        - event: AppMetadataURIUpdated(indexed bytes32,string,string)
          handler: handleAppMetadataURIUpdated
        - event: VotingEligibilityUpdated(indexed bytes32,bool)
          handler: handleAppVotingEligibilityUpdated
        - event: BlacklistUpdated(indexed bytes32,bool)
          handler: handleAppBlackListUpdated
        - event: AppEndorsed(indexed bytes32,uint256,bool)
          handler: handleAppEndorsed
        - event: AppEndorsementStatusUpdated(indexed bytes32,bool)
          handler: handleAppEndorsementStatusUpdated
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: RewardsPool
    network: mainnet
    source:
      address: "0x6Bee7DDab6c99d5B2Af0554EaEA484CE18F52631"
      abi: RewardsPool
      startBlock: 18868859
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppRewardTransfer
        - SustainabilityProofDocument
      abis:
        - name: RewardsPool
          file: ../../../abis/VeBetterDAO-x-2-earns-rewards-pool.json
      eventHandlers:
        - event: NewDeposit(uint256,indexed bytes32,indexed address)
          handler: handleNewDeposit
        - event: TeamWithdrawal(uint256,indexed bytes32,indexed address,address,string)
          handler: handleTeamWithdrawal
        - event: RewardDistributed(uint256,indexed bytes32,indexed address,string,indexed address)
          handler: handleRewardDistribution
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: DynamicBaseAllocations
    network: mainnet
    source:
      address: "0x98C1D097C39969bB5dE754266F60D22BD105B368"
      abi: DynamicBaseAllocations
      startBlock: 23162576
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppAllocationFunded
      abis:
        - name: DynamicBaseAllocations
          file: ../../../abis/VeBetterDAO-dynamic-base-allocation.json
      eventHandlers:
        - event: FundsDistributedToApp(indexed bytes32,uint256,indexed uint256)
          handler: handleFundsDistributedToApp
      file: ./src/mapping.ts
templates:
  - kind: file/ipfs
    name: AppMetadataDocument
    network: mainnet
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/metadata.ts
      handler: handleAppMetadata
      entities:
        - AppMetadataDocument
      abis: []
  - kind: file/ipfs
    name: SustainabilityProofDocument
    network: mainnet
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/metadata.ts
      handler: handleSustainabilityProof
      entities:
        - SustainabilityProofDocument
      abis: []
